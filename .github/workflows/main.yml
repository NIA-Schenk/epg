name: Update French TV guide

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4,6,13 * * *'
      timezone: Europe/Amsterdam

permissions:
  contents: write

concurrency:
  group: french-epg
  cancel-in-progress: false

jobs:
  update-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Download EPG grabber
        run: git clone --depth 1 --branch master https://github.com/iptv-org/epg.git epg

      - name: Install dependencies
        working-directory: epg
        run: npm install

      - name: Check out publishing repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: publish

      - name: Generate XMLTV guide
        working-directory: epg
        run: |
          cp ../publish/fr.channels.xml ./fr.channels.xml
          npm run grab --- --channels=fr.channels.xml

      - name: Use playlist logos in XMLTV
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          playlist = Path("publish/fr-selected.m3u").read_text(encoding="utf-8-sig")
          logos = {}

          for line in playlist.splitlines():
              if not line.startswith("#EXTINF:"):
                  continue

              channel_id = re.search(r'tvg-id="([^"]+)"', line)
              logo = re.search(r'tvg-logo="([^"]+)"', line)
              if channel_id and logo:
                  logos[channel_id.group(1)] = logo.group(1)

          guide_path = Path("epg/guide.xml")
          tree = ET.parse(guide_path)

          for channel in tree.getroot().findall("channel"):
              logo_url = logos.get(channel.get("id"))
              if logo_url:
                  for icon in channel.findall("icon"):
                      channel.remove(icon)
                  ET.SubElement(channel, "icon", {"src": logo_url})

          tree.write(guide_path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Validate XMLTV guide
        run: python3 -c 'import sys, xml.etree.ElementTree as ET; root = ET.parse("epg/guide.xml").getroot(); sys.exit(0 if root.tag == "tv" and root.find("programme") is not None else "XMLTV guide contains no programmes")'

      - name: Publish guide
        working-directory: publish
        run: |
          cp ../epg/guide.xml ./fr.xml
          git add -- fr.xml
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update French TV guide"
          git push
